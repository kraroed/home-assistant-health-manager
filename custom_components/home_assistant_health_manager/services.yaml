run_diagnostics:
  name: Run diagnostics
  description: Collect a local diagnostic snapshot and create a sanitized report.
  fields:
    comprehensive:
      name: Comprehensive
      description: Mark the report as a monthly comprehensive assessment.
      required: false
      selector:
        boolean:
generate_report:
  name: Generate report
  description: Generate a sanitized diagnostic ZIP immediately.
  fields:
    comprehensive:
      name: Comprehensive
      description: Mark the report as a monthly comprehensive assessment.
      required: false
      selector:
        boolean:

generate_ai_repair_prompt:
  name: Generate AI repair prompt
  description: Create a diagnostic report and a copy-ready AI prompt for guided repairs and validation.
  fields:
    comprehensive:
      name: Comprehensive
      description: Use the monthly comprehensive assessment scope.
      required: false
      selector:
        boolean:

generate_focused_repair_prompt:
  name: Generate focused repair prompt
  description: Create a copy-ready AI investigation prompt for one item in the latest prioritized repair plan. Generate a diagnostic report first.
  fields:
    plan_id:
      name: Repair plan item ID
      description: Exact plan_id from the Prioritized Repair Plan Items sensor attributes.
      required: true
      selector:
        text:

set_repair_investigation_status:
  name: Set repair investigation status
  description: Update your local tracking label for a focused repair investigation. This does not mark a Home Assistant issue as technically fixed or change the system.
  fields:
    plan_id:
      name: Repair plan item ID
      description: Exact plan_id shown in the Repair Investigations sensor attributes.
      required: true
      selector:
        text:
    status:
      name: Investigation status
      description: Your tracking label for this investigation.
      required: true
      selector:
        select:
          options:
            - prompt_generated
            - in_progress
            - resolved
            - needs_follow_up
            - dismissed
