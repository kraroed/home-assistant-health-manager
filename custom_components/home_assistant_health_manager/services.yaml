run_diagnostics:
  name: Run diagnostics
  description: Collect a local diagnostic snapshot and create a sanitized report.
  fields:
    comprehensive:
      name: Comprehensive
      description: Mark the report as a monthly comprehensive assessment.
      required: false
      selector:
        boolean:
generate_report:
  name: Generate report
  description: Generate a sanitized diagnostic ZIP immediately.
  fields:
    comprehensive:
      name: Comprehensive
      description: Mark the report as a monthly comprehensive assessment.
      required: false
      selector:
        boolean:

generate_ai_repair_prompt:
  name: Generate AI repair prompt
  description: Create a diagnostic report and a copy-ready AI prompt for guided repairs and validation.
  fields:
    comprehensive:
      name: Comprehensive
      description: Use the monthly comprehensive assessment scope.
      required: false
      selector:
        boolean:

generate_focused_repair_prompt:
  name: Generate focused repair prompt
  description: Create a copy-ready AI investigation prompt for one item in the latest prioritized repair plan. Generate a diagnostic report first.
  fields:
    plan_id:
      name: Repair plan item ID
      description: Exact plan_id from the Prioritized Repair Plan Items sensor attributes.
      required: true
      selector:
        text:

set_repair_investigation_status:
  name: Set repair investigation status
  description: Update your local tracking label for a focused repair investigation. This does not mark a Home Assistant issue as technically fixed or change the system.
  fields:
    plan_id:
      name: Repair plan item ID
      description: Exact plan_id shown in the Repair Investigations sensor attributes.
      required: true
      selector:
        text:
    status:
      name: Investigation status
      description: Your tracking label for this investigation.
      required: true
      selector:
        select:
          options:
            - prompt_generated
            - in_progress
            - resolved
            - needs_follow_up
            - dismissed

set_entity_classification:
  name: Set entity classification
  description: Save or update a user-managed classification and reason for one entity. This does not change the entity or suppress raw diagnostic data.
  fields:
    entity_id:
      name: Entity ID
      description: One exact Home Assistant entity ID to classify (legacy single-entity form).
      required: false
      selector:
        entity:
    entity_ids:
      name: Entity IDs
      description: Multiple exact Home Assistant entity IDs to classify together with one shared reason.
      required: false
      selector:
        entity:
          multiple: true
    classification:
      name: Classification
      description: How this entity should be tracked.
      required: true
      selector:
        select:
          options:
            - actionable
            - expected
            - setup_in_progress
            - seasonal
    reason:
      name: Reason
      description: Explain why this classification applies.
      required: true
      selector:
        text:
          multiline: true
    entity_domain:
      name: Entity domain
      required: false
      selector:
        text:
    source_domain:
      name: Source integration
      required: false
      selector:
        text:
    source_unique_id:
      name: Source unique ID
      required: false
      selector:
        text:

remove_entity_classification:
  name: Remove entity classification
  description: Explicitly remove the saved classification for one entity. The entity itself is not changed or deleted.
  fields:
    entity_id:
      name: Entity ID
      required: true
      selector:
        entity:

set_classification_review_interval:
  name: Set classification review interval
  description: Choose how often saved classifications should be reviewed. Manual disables scheduled review reminders.
  fields:
    interval:
      name: Review interval
      required: true
      selector:
        select:
          options:
            - label: Manual only
              value: manual
            - label: Every 30 days
              value: "30"
            - label: Every 60 days
              value: "60"
            - label: Every 90 days
              value: "90"

review_entity_classifications:
  name: Confirm entity classification review
  description: Confirm one or more saved classifications without changing their classification or explanation. Supports bulk confirmation.
  fields:
    entity_ids:
      name: Entity IDs
      description: One or more exact entity IDs whose current classifications you have reviewed.
      required: true
      selector:
        entity:
          multiple: true

start_unavailable_investigation:
  name: Start unavailable entity investigation
  description: Manually start tracking one or more currently unavailable entities, even before the automatic persistence threshold is reached.
  fields:
    entity_ids:
      name: Entity IDs
      description: Exact unavailable entity IDs to include in this user-started investigation.
      required: true
      selector:
        entity:
          multiple: true

set_unavailable_investigation_status:
  name: Set unavailable investigation status
  description: Update your tracking status for an unavailable-entity investigation. Expected and resolved are user decisions only; they do not classify, suppress, or repair entities.
  fields:
    investigation_id:
      name: Investigation ID
      description: Exact investigation_id from the Unavailable Investigations sensor.
      required: true
      selector:
        text:
    status:
      name: Status
      required: true
      selector:
        select:
          options:
            - needs_review
            - investigating
            - waiting
            - resolved
            - expected
    user_note:
      name: User note
      required: false
      selector:
        text:
          multiline: true
